# PostgREST solo expone el schema api (Functions RPC).
# Las tablas viven en negocio y no se publican como REST.
#
# Development: contraseña de ejemplo. En QA/Production use secretos
# (PGRST_DB_URI, Docker secrets o un vault).

db-uri = "postgres://authenticator:changeme_dev_only@localhost:5432/miproyecto"
db-schemas = "api"
db-anon-role = "api_user"
db-extra-search-path = "public"

server-port = 3000
server-host = "!4"
openapi-mode = "disabled"

# La API .NET valida el JWT. PostgREST usa el rol técnico api_user.
# No configurar jwt-secret aquí salvo que se decida reenviar el JWT.
